<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Météo Pure</title>

    <!-- Preloaded so the first paint isn't a flash of system font on the
         hero temperature, which is the largest text on screen. -->
    <link rel="preload" href="/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-serif-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Instant sky color & dark canvas style to avoid white flashes during startup -->
    <style>
      :root {
        color-scheme: dark;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0b1020;
        color: #ffffff;
        overflow: hidden;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      #root:empty {
        height: 100%;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: inherit;
      }
    </style>
    <script>
      (function() {
        try {
          // Thème choisi : posé avant le premier rendu pour éviter un flash de l'ancien.
          var th = localStorage.getItem('meteo_pure_theme');
          var themeColors = { aurora: '#0b1020', kraft: '#f2e8d5', radar: '#030a06', pop: '#ff3d8b' };
          var initialColor = '#3878cf';
          if (th && themeColors[th]) {
            document.documentElement.setAttribute('data-theme', th);
            initialColor = themeColors[th];
          } else {
            var c = localStorage.getItem('meteo_pure_sky_color');
            if (c) initialColor = c;
          }
          document.documentElement.style.backgroundColor = initialColor;
          document.addEventListener('DOMContentLoaded', function() {
            if (document.body) document.body.style.backgroundColor = initialColor;
          });
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', initialColor);
        } catch (e) {}
      })();
    </script>

    <!-- PWA Meta Tags & Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#3878cf" />

    <!-- Standalone PWA capability (modern standard, read by Chrome/Android) -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Apple standalone capabilities (iOS Safari still requires these) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Météo Pure" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Service Worker Registration — register ASAP for push reliability.
         This is the only registration call in the app; src/main.tsx only
         reads back navigator.serviceWorker.ready to force an update check
         and reload on activation, rather than registering a second time. -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js')
          .then(function(reg) {
            console.log('SW registered:', reg.scope);
            // Keep SW alive on Android via Periodic Background Sync (if available)
            if ('periodicSync' in reg) {
              reg.periodicSync.register('push-keepalive', { minInterval: 12 * 60 * 60 * 1000 })
                .catch(function() {});
            }
          })
          .catch(function(err) {
            console.error('SW registration failed:', err);
          });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
