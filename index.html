<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Météo Pure</title>

    <!-- Preloaded so the first paint isn't a flash of system font on the
         hero temperature, which is the largest text on screen. -->
    <link rel="preload" href="/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin />

    <!-- PWA Meta Tags & Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#123a5e" />

    <!-- Standalone PWA capability (modern standard, read by Chrome/Android) -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Apple standalone capabilities (iOS Safari still requires these) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Météo Pure" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Service Worker Registration — register ASAP for push reliability.
         This is the only registration call in the app; src/main.tsx only
         reads back navigator.serviceWorker.ready to force an update check
         and reload on activation, rather than registering a second time. -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js')
          .then(function(reg) {
            console.log('SW registered:', reg.scope);
            // Keep SW alive on Android via Periodic Background Sync (if available)
            if ('periodicSync' in reg) {
              reg.periodicSync.register('push-keepalive', { minInterval: 12 * 60 * 60 * 1000 })
                .catch(function() {});
            }
          })
          .catch(function(err) {
            console.error('SW registration failed:', err);
          });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
